<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Apply saved theme before first paint to avoid a flash of the wrong mode -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#d32f2f">
  <title>SG Bus Arrival</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect x='0' y='0' width='96' height='96' rx='20' fill='%23fff'/%3E%3Crect x='16' y='40' width='4' height='11' rx='2' fill='%23d32f2f'/%3E%3Crect x='76' y='40' width='4' height='11' rx='2' fill='%23d32f2f'/%3E%3Crect x='18' y='20' width='60' height='50' rx='13' fill='%23d32f2f'/%3E%3Crect x='24' y='29' width='21' height='17' rx='4.5' fill='%23fff'/%3E%3Crect x='51' y='29' width='21' height='17' rx='4.5' fill='%23fff'/%3E%3Ccircle cx='35' cy='38' r='3.4' fill='%23d32f2f'/%3E%3Ccircle cx='62' cy='38' r='3.4' fill='%23d32f2f'/%3E%3Cpath d='M40 56 q8 6.5 16 0' stroke='%23fff' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Crect x='27' y='67' width='11' height='8' rx='3' fill='%233a3a3a'/%3E%3Crect x='58' y='67' width='11' height='8' rx='3' fill='%233a3a3a'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect x='0' y='0' width='96' height='96' rx='20' fill='%23fff'/%3E%3Crect x='16' y='40' width='4' height='11' rx='2' fill='%23d32f2f'/%3E%3Crect x='76' y='40' width='4' height='11' rx='2' fill='%23d32f2f'/%3E%3Crect x='18' y='20' width='60' height='50' rx='13' fill='%23d32f2f'/%3E%3Crect x='24' y='29' width='21' height='17' rx='4.5' fill='%23fff'/%3E%3Crect x='51' y='29' width='21' height='17' rx='4.5' fill='%23fff'/%3E%3Ccircle cx='35' cy='38' r='3.4' fill='%23d32f2f'/%3E%3Ccircle cx='62' cy='38' r='3.4' fill='%23d32f2f'/%3E%3Cpath d='M40 56 q8 6.5 16 0' stroke='%23fff' stroke-width='3' stroke-linecap='round' fill='none'/%3E%3Crect x='27' y='67' width='11' height='8' rx='3' fill='%233a3a3a'/%3E%3Crect x='58' y='67' width='11' height='8' rx='3' fill='%233a3a3a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Loading / Error overlay -->
  <div id="loading-overlay">
    <div id="loading-inner">
      <svg class="buski-mascot" width="88" height="88" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="48" cy="87" rx="25" ry="4" fill="rgba(0,0,0,.08)"/>
        <rect x="16" y="40" width="4" height="11" rx="2" fill="var(--red)"/>
        <rect x="76" y="40" width="4" height="11" rx="2" fill="var(--red)"/>
        <rect x="18" y="20" width="60" height="50" rx="13" fill="var(--red)"/>
        <rect x="24" y="29" width="21" height="17" rx="4.5" fill="#fff"/>
        <rect x="51" y="29" width="21" height="17" rx="4.5" fill="#fff"/>
        <circle cx="35" cy="38" r="3.4" fill="var(--red)"/>
        <circle cx="62" cy="38" r="3.4" fill="var(--red)"/>
        <path d="M40 56 q8 6.5 16 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="27" y="67" width="11" height="8" rx="3" fill="#3a3a3a"/>
        <rect x="58" y="67" width="11" height="8" rx="3" fill="#3a3a3a"/>
      </svg>
      <div class="spinner"></div>
      <p id="loading-text">Warming up Buski…</p>
      <a id="loading-link" href="https://datamall.lta.gov.sg/content/datamall/en/request-for-api.html" target="_blank" class="hidden">Get a free API key →</a>
    </div>
  </div>

  <!-- Location permission prompt -->
  <div id="location-prompt" class="hidden">
    <div id="location-card">
      <svg class="buski-mascot" width="76" height="76" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <ellipse cx="48" cy="87" rx="25" ry="4" fill="rgba(0,0,0,.08)"/>
        <rect x="16" y="40" width="4" height="11" rx="2" fill="var(--red)"/>
        <rect x="76" y="40" width="4" height="11" rx="2" fill="var(--red)"/>
        <rect x="18" y="20" width="60" height="50" rx="13" fill="var(--red)"/>
        <rect x="24" y="29" width="21" height="17" rx="4.5" fill="#fff"/>
        <rect x="51" y="29" width="21" height="17" rx="4.5" fill="#fff"/>
        <circle cx="35" cy="38" r="3.4" fill="var(--red)"/>
        <circle cx="62" cy="38" r="3.4" fill="var(--red)"/>
        <path d="M40 56 q8 6.5 16 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
        <rect x="27" y="67" width="11" height="8" rx="3" fill="#3a3a3a"/>
        <rect x="58" y="67" width="11" height="8" rx="3" fill="#3a3a3a"/>
      </svg>
      <p id="location-welcome">
        <span class="welcome-hi">Welcome to</span>
        <strong>Buski</strong>
        <span class="welcome-sub">Your friendly guide to live bus arrivals across Singapore 👋</span>
      </p>

      <div class="location-divider"></div>

      <h2 id="location-title">Find stops near you</h2>
      <p id="location-desc">Turn on location and we'll center the map on you and show your nearest bus stops.</p>
      <div id="location-actions">
        <button id="location-skip" type="button">Not now</button>
        <button id="location-enable" type="button">Enable location</button>
      </div>
    </div>
  </div>

  <!-- Search bar -->
  <div id="search-bar">
    <div id="search-box" class="glass">
      <svg class="icon-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        id="search-input"
        type="text"
        inputmode="search"
        placeholder="Postal, bus stop code or name"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
      >
      <button id="clear-btn" class="hidden" aria-label="Clear search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="search-results" class="hidden"></div>
  </div>

  <!-- Map -->
  <div id="map"></div>

  <!-- Zoom hint -->
  <div id="zoom-hint" class="hidden">Zoom in to see bus stops</div>

  <!-- Clear route button (appears when a route is shown) -->
  <button id="clear-route-btn" class="hidden">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    <span id="clear-route-label">Clear route</span>
  </button>

  <!-- Map controls (top-right glass stack) -->
  <div id="map-controls">
    <button id="theme-toggle" class="map-btn glass" aria-label="Toggle dark mode">
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
      </svg>
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4.5"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>

    <div class="zoom-group glass">
      <button id="zoom-in" class="map-btn" aria-label="Zoom in">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button id="zoom-out" class="map-btn" aria-label="Zoom out">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>

    <button id="locate-btn" class="map-btn glass" aria-label="Go to my location">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
        <circle cx="12" cy="12" r="9" stroke-dasharray="2 4"/>
      </svg>
    </button>
  </div>

  <!-- Buy me a coffee — top-left so the bottom sheet never covers it -->
  <a id="kopi-btn" class="map-btn glass" href="https://buymeacoffee.com/buski" target="_blank" rel="noopener" aria-label="Buy me a coffee">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 8h1.5a3 3 0 0 1 0 6H17"/>
      <path d="M4 8h13v6.5A4.5 4.5 0 0 1 12.5 19h-4A4.5 4.5 0 0 1 4 14.5V8Z"/>
      <path d="M7 2.5v2M10.5 2.5v2M14 2.5v2"/>
    </svg>
  </a>

  <!-- Nearby stops sheet (always-visible peek, drag up to expand) -->
  <div id="nearby-sheet">
    <div id="nearby-handle">
      <div class="handle-bar"></div>
      <div class="nearby-title">
        <span class="nearby-title-text">Bus stops</span>
        <svg class="chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </div>
    </div>
    <div id="nearby-list"></div>
  </div>

  <!-- Bottom sheet -->
  <div id="bottom-sheet">
    <div id="drag-handle"></div>

    <div id="sheet-header">
      <button id="back-btn" class="hidden" aria-label="Back to nearby stops">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div id="stop-details">
        <div id="stop-top">
          <span id="stop-code-badge"></span>
          <span id="stop-name"></span>
        </div>
        <div id="stop-road"></div>
      </div>
      <button id="fav-stop-btn" class="star-btn" aria-label="Favourite this stop">
        <svg class="star-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M12 2.6l2.75 5.57 6.15.9-4.45 4.34 1.05 6.12L12 16.9l-5.5 2.89 1.05-6.12L3.1 9.07l6.15-.9z"/>
        </svg>
      </button>
      <button id="close-btn" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div id="meta-bar">
      <span id="updated-label">—</span>
      <button id="refresh-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        Refresh
      </button>
    </div>

    <div id="filter-chips">
      <button type="button" class="filter-chip active" data-filter="all">All</button>
      <button type="button" class="filter-chip" data-filter="saved">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" class="chip-star"><path d="M12 2.6l2.75 5.57 6.15.9-4.45 4.34 1.05 6.12L12 16.9l-5.5 2.89 1.05-6.12L3.1 9.07l6.15-.9z"/></svg>
        Saved
      </button>
      <button type="button" class="filter-chip" data-filter="arriving">Arriving</button>
    </div>

    <div id="services-list"></div>

    <!-- Route stop list (shown when a bus number is tapped) -->
    <div id="route-panel">
      <div id="route-panel-header">
        <button id="route-back-btn" aria-label="Back to arrivals">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div id="route-panel-info">
          <div id="route-panel-title"></div>
          <div id="route-panel-sub"></div>
        </div>
      </div>
      <div id="route-stops"></div>
    </div>
  </div>

  <!-- Toast (non-blocking status messages) -->
  <div id="toast" class="hidden" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/js/app.js"></script>

  <!-- Analytics: GoatCounter -->
  <script data-goatcounter="https://sg-bus-arrival.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>

  <!-- Analytics: Vercel -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
